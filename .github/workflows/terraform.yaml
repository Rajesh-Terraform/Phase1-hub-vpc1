name: phase1-hub-vpc1-destroy

on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      # 4. Show Terraform Files
      - name: Show Terraform Files
        run: |
          pwd
          echo "Terraform files:"
          find terraform -name "*.tf" -type f
        working-directory: .

      # 5. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      # 6. Terraform Init
      - name: Terraform Init
        run: terraform init -input=false
        working-directory: terraform

      # 7. Terraform Validate
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

      # 8. Show Terraform State
      - name: Terraform State List
        run: terraform state list
        working-directory: terraform

      # 9. Terraform Destroy Plan
      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false
        working-directory: terraform

      # 10. Terraform Destroy
      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
        working-directory: terraform