
name: phase1-hub-vpc1-destroy

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647132523867:role/github-actions-terraform-role-v1
          aws-region: ap-south-1

      # ==================================================
      # SET YOUR VPC ID HERE
      # ==================================================
      - name: Set VPC ID
        run: |
          echo "VPC_ID=vpc-XXXXXXXXXXXX" >> "$GITHUB_ENV"

      # ==================================================
      # VERIFY VPC
      # ==================================================
      - name: Verify VPC
        run: |
          set -e

          echo "Checking VPC: $VPC_ID"

          aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --region ap-south-1

      # ==================================================
      # DELETE NAT GATEWAYS
      # ==================================================
      - name: Delete NAT Gateways
        run: |
          set -e

          NAT_IDS=$(aws ec2 describe-nat-gateways \
            --region ap-south-1 \
            --filter "Name=vpc-id,Values=$VPC_ID" \
            --query "NatGateways[?State!='deleted'].NatGatewayId" \
            --output text)

          if [ -z "$NAT_IDS" ]; then
            echo "No NAT Gateways found."
          else
            for NAT_ID in $NAT_IDS; do
              echo "Deleting NAT Gateway: $NAT_ID"

              aws ec2 delete-nat-gateway \
                --nat-gateway-id "$NAT_ID" \
                --region ap-south-1
            done

            echo "Waiting for NAT Gateways..."

            sleep 30
          fi

      # ==================================================
      # DELETE VPC ENDPOINTS
      # ==================================================
      - name: Delete VPC Endpoints
        run: |
          ENDPOINT_IDS=$(aws ec2 describe-vpc-endpoints \
            --region ap-south-1 \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "VpcEndpoints[].VpcEndpointId" \
            --output text)

          if [ -n "$ENDPOINT_IDS" ]; then
            echo "Deleting VPC endpoints: $ENDPOINT_IDS"

            aws ec2 delete-vpc-endpoints \
              --region ap-south-1 \
              --vpc-endpoint-ids $ENDPOINT_IDS
          else
            echo "No VPC endpoints found."
          fi

      # ==================================================
      # DELETE SUBNETS
      # ==================================================
      - name: Delete Subnets
        run: |
          set -e

          SUBNET_IDS=$(aws ec2 describe-subnets \
            --region ap-south-1 \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "Subnets[].SubnetId" \
            --output text)

          if [ -z "$SUBNET_IDS" ]; then
            echo "No subnets found."
          else
            for SUBNET_ID in $SUBNET_IDS; do
              echo "Deleting subnet: $SUBNET_ID"

              aws ec2 delete-subnet \
                --subnet-id "$SUBNET_ID" \
                --region ap-south-1
            done
          fi

      # ==================================================
      # DELETE CUSTOM ROUTE TABLES
      # ==================================================
      - name: Delete Route Tables
        run: |
          set -e

          ROUTE_TABLE_IDS=$(aws ec2 describe-route-tables \
            --region ap-south-1 \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "RouteTables[].RouteTableId" \
            --output text)

          for RT_ID in $ROUTE_TABLE_IDS; do

            MAIN=$(aws ec2 describe-route-tables \
              --route-table-ids "$RT_ID" \
              --region ap-south-1 \
              --query "RouteTables[0].Associations[?Main==\`true\`].Main" \
              --output text)

            if [ "$MAIN" != "True" ]; then
              echo "Deleting route table: $RT_ID"

              aws ec2 delete-route-table \
                --route-table-id "$RT_ID" \
                --region ap-south-1 || true
            else
              echo "Skipping main route table: $RT_ID"
            fi
          done

      # ==================================================
      # DELETE INTERNET GATEWAY
      # ==================================================
      - name: Delete Internet Gateway
        run: |
          set -e

          IGW_IDS=$(aws ec2 describe-internet-gateways \
            --region ap-south-1 \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query "InternetGateways[].InternetGatewayId" \
            --output text)

          if [ -z "$IGW_IDS" ]; then
            echo "No Internet Gateway found."
          else
            for IGW_ID in $IGW_IDS; do

              echo "Detaching Internet Gateway: $IGW_ID"

              aws ec2 detach-internet-gateway \
                --internet-gateway-id "$IGW_ID" \
                --vpc-id "$VPC_ID" \
                --region ap-south-1

              echo "Deleting Internet Gateway: $IGW_ID"

              aws ec2 delete-internet-gateway \
                --internet-gateway-id "$IGW_ID" \
                --region ap-south-1
            done
          fi

      # ==================================================
      # DELETE NON-DEFAULT SECURITY GROUPS
      # ==================================================
      - name: Delete Security Groups
        run: |
          set -e

          SG_IDS=$(aws ec2 describe-security-groups \
            --region ap-south-1 \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?GroupName!='default'].GroupId" \
            --output text)

          if [ -z "$SG_IDS" ]; then
            echo "No custom security groups found."
          else
            for SG_ID in $SG_IDS; do
              echo "Deleting security group: $SG_ID"

              aws ec2 delete-security-group \
                --group-id "$SG_ID" \
                --region ap-south-1 || true
            done
          fi

      # ==================================================
      # DELETE VPC
      # ==================================================
      - name: Delete VPC
        run: |
          set -e

          echo "Deleting VPC: $VPC_ID"

          aws ec2 delete-vpc \
            --vpc-id "$VPC_ID" \
            --region ap-south-1

          echo "=========================================="
          echo "SUCCESS: VPC deleted"
          echo "VPC ID: $VPC_ID"
          echo "Region: ap-south-1"
          echo "=========================================="

